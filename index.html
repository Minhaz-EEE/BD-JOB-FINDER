<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5ed7">
<title>Chakri Finder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--blue:#0b5ed7;--navy:#0a2a66;--sky:#e8f1ff;--line:#d5e2f7;--ink:#10203b;--mute:#5b6b85;--bg:#f3f7fd;--card:#fff;--ok:#12805c;--warn:#b45309;--bad:#c0262d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
header small{display:block;font-weight:400;font-size:11px;opacity:.85}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:8px 10px;font-size:16px;position:relative}
header .dot{position:absolute;top:-4px;right:-4px;background:#ffb020;color:#10203b;border-radius:9px;font-size:10px;padding:1px 5px;font-weight:700}
main{padding:14px 14px 90px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue);font-weight:700}
h2{font-size:16px;margin:18px 0 8px;color:var(--navy)}
h3{font-size:15px;margin:6px 0 2px}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 2px rgba(10,42,102,.05)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit}
.tile b{display:block;font-size:26px;color:var(--blue);line-height:1.1}
.tile span{font-size:12.5px;color:var(--mute)}
.tile.hot b{color:var(--warn)}
.hero{background:linear-gradient(135deg,var(--blue),#3b8bff);color:#fff;border:0}
.hero p{opacity:.92;margin:2px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--sky);color:var(--blue)}
.tag.gov{background:#e2f5ec;color:var(--ok)}.tag.remote{background:#efe8ff;color:#5b3fc4}.tag.private{background:#fff1dc;color:var(--warn)}
.tag.bad{background:#fde7e8;color:var(--bad)}.tag.ok{background:#e2f5ec;color:var(--ok)}
.src,.meta{font-size:12.5px;color:var(--mute)}
.match{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue)}
.desc{font-size:13.5px;color:#33435e}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:8px 12px;font:600 13px/1 inherit;text-decoration:none;min-height:36px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font:600 13px inherit;color:var(--mute)}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:10px 0 4px}
.search{display:flex;gap:8px}
.banner{background:#fff7e6;border:1px solid #f5d48a;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.alert{border-left:4px solid var(--warn)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
summary{font-weight:700;color:var(--navy);cursor:pointer}
ol,ul{padding-left:20px;margin:8px 0}
li{margin:4px 0}
#modal{position:fixed;inset:0;background:rgba(10,32,70,.5);z-index:10;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 26px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:20;display:none;max-width:90%}
.copy{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.copy span{font-size:13.5px;word-break:break-word}.copy small{display:block;color:var(--mute);font-size:11.5px}
#cv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;font-size:13.5px}
#cv h1{font-size:22px;margin:0;color:var(--navy)}
#cv h4{margin:14px 0 4px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:2px}
#cv .sub{color:var(--mute)}#cv .item{margin:6px 0}#cv .item b{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media print{header,nav,.noprint,#toast{display:none!important}main{padding:0;max-width:none}body{background:#fff}#cv{border:0;padding:0}}
</style>
</head>
<body>
<header><h1>Chakri Finder<small id="fresh">Bangladesh &amp; remote jobs</small></h1><button id="bell" data-act="go" data-tab="home" aria-label="Alerts">🔔</button></header>
<main id="view"></main>
<nav id="tabs"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- helpers & storage ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='chakri-finder-v1',mem={};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const DEF={profile:{name:'',title:'',email:'',phone:'',address:'',linkedin:'',summary:'',skills:'',experience:[],education:[],training:[],extras:''},apps:[],favs:{},settings:{aiKey:'',aiModel:'gemini-2.5-flash',notify:false},seen:{},tailor:null};
let S=merge(JSON.parse(ls.get(KEY)||'{}'));
function merge(o){const d=JSON.parse(JSON.stringify(DEF));return Object.assign(d,o,{profile:Object.assign(d.profile,o.profile||{}),settings:Object.assign(d.settings,o.settings||{})})}
const save=()=>ls.set(KEY,JSON.stringify(S));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const nice=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const inDays=n=>n===0?'today':n===1?'tomorrow':'in '+n+' days';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(text instanceof Blob?text:new Blob([text],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* files (certificates, admit cards) live in the phone's browser storage */
const memFiles=[];
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('chakri-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fileOp(mode,fn){try{const db=await idb();return await new Promise((res,rej)=>{const tx=db.transaction('files',mode);const rq=fn(tx.objectStore('files'));tx.oncomplete=()=>res(rq?rq.result:true);tx.onerror=()=>rej(tx.error)})}catch(e){return null}}
const Files={
  async all(){return (await fileOp('readonly',s=>s.getAll()))||memFiles},
  async put(f){memFiles.push(f);await fileOp('readwrite',s=>s.put(f))},
  async del(id){const i=memFiles.findIndex(f=>f.id===id);if(i>=0)memFiles.splice(i,1);await fileOp('readwrite',s=>s.delete(id))}
};

/* ---------- data ---------- */
const SAMPLE={demo:true,updated:'',status:[],notices:[],jobs:[
 {id:'s1',title:'Sample: Assistant Engineer (Electrical) – government circular',org:'Teletalk All Jobs portal',cat:'gov',loc:'Bangladesh',posted:'',deadline:'',url:'https://alljobs.teletalk.com.bd',src:'Sample',tags:['Engineering','EEE'],desc:'This is a sample card. Real government circulars appear here after the first automatic collection.'},
 {id:'s2',title:'Sample: Officer (Technical) – private sector',org:'bdjobs.com',cat:'private',loc:'Dhaka',posted:'',deadline:'',url:'https://www.bdjobs.com',src:'Sample',tags:['Private'],desc:'Sample card for a private-sector job.'},
 {id:'s3',title:'Sample: Remote Electrical Design Engineer',org:'International company',cat:'remote',loc:'Worldwide',posted:'',deadline:'',url:'https://remotive.com',src:'Sample',tags:['Remote','Engineering'],desc:'Sample card for an international remote job.'}]};
let DB=SAMPLE;
async function loadData(){
  try{const r=await fetch('data/jobs.json?t='+Date.now());const d=await r.json();if(d&&d.jobs&&d.jobs.length)DB=d;else DB=Object.assign({},SAMPLE,{status:d.status||[]})}catch(e){DB=SAMPLE}
  DB.jobs=DB.jobs.filter(j=>!j.deadline||days(j.deadline)>=0);DB.notices=DB.notices||[];
  scoreAll();
  $('#fresh').textContent=DB.updated?'Updated '+new Date(DB.updated).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Bangladesh & remote jobs';
}

/* ---------- matching & smart search ---------- */
const STOP=new Set('a an the and or of in for to with at on by is are as be from this that will you your our we job jobs circular new apply online has have been its their all any more about into per not can who what which also etc using use work working'.split(' '));
const tok=s=>(String(s||'').toLowerCase().match(/[a-z][a-z+#]+|[ঀ-৿]{2,}/g)||[]).filter(w=>!STOP.has(w));
const SYN={eee:['electrical','electronic','electronics','engineer'],electrical:['eee','electric','power','বিদ্যুৎ','প্রকৌশলী'],electronic:['eee','electronics'],engineer:['engineering','প্রকৌশলী','প্রকৌশল'],engineering:['engineer','প্রকৌশলী'],nuclear:['npcbl','rooppur','reactor','atomic','পারমাণবিক'],power:['pdb','pgcb','desco','dpdc','nesco','egcb','energy','বিদ্যুৎ'],energy:['power','renewable','solar'],finance:['bank','investment','financial','ব্যাংক'],bank:['ব্যাংক','banking','finance'],infrastructure:['project','construction'],teacher:['শিক্ষক','lecturer','teaching'],officer:['কর্মকর্তা'],govt:['সরকারি'],it:['software','developer'],software:['developer','programmer']};
function expand(base){const set=new Set(base);base.forEach(w=>(SYN[w]||[]).forEach(x=>set.add(x)));return set}
function profileWords(){const p=S.profile;return expand(tok([p.title,p.skills,p.summary,p.education.map(e=>e.a).join(' '),p.experience.map(e=>e.a).join(' ')].join(' ')))}
function scoreAll(){const w=profileWords();DB.jobs.forEach(j=>{if(!w.size){j._m=0;return}let s=0;new Set(tok(j.title)).forEach(x=>{if(w.has(x))s+=3});new Set(tok((j.tags||[]).join(' ')+' '+j.desc+' '+j.org)).forEach(x=>{if(w.has(x))s+=1});j._m=Math.min(100,Math.round(s/9*100))})}
function smart(q){
  const low=q.toLowerCase(),f={cat:'',within:null};
  if(/remote|international|work from home|wfh|abroad|রিমোট|বিদেশ/.test(low))f.cat='remote';
  else if(/private|company|non.?gov|বেসরকারি|ngo/.test(low))f.cat='private';
  else if(/gov|সরকারি/.test(low))f.cat='gov';
  if(/today|আজ/.test(low))f.within=1;else if(/week|7 days|সপ্তাহ/.test(low))f.within=7;else if(/month|মাস/.test(low))f.within=30;
  f.fit=/for me|my resume|my cv|suitable|match|আমার/.test(low);
  const drop=new Set('gov govt government private company remote international today week month deadline me my resume cv suitable match find show search latest next days home abroad non only this within last date সরকারি বেসরকারি চাকরি'.split(' '));
  f.base=tok(low).filter(w=>!drop.has(w));f.words=[...expand(f.base)];return f;
}
const ui={tab:'home',cat:'all',q:'',sort:'new',limit:30,rtab:'edit',mtab:''};
function listJobs(){
  let arr=DB.jobs.slice();const f=ui.q.trim()?smart(ui.q):null;const cat=(f&&f.cat)||ui.cat;
  if(cat==='saved')arr=Object.values(S.favs);
  else if(cat==='me')arr=arr.filter(j=>j._m>=20);
  else if(cat==='week')arr=arr.filter(j=>j.deadline&&days(j.deadline)<=7);
  else if(cat!=='all')arr=arr.filter(j=>j.cat===cat);
  if(f&&f.within)arr=arr.filter(j=>j.deadline&&days(j.deadline)<=f.within);
  if(f&&f.words.length){
    arr=arr.map(j=>{const t=j.title.toLowerCase(),all=(j.org+' '+(j.tags||[]).join(' ')+' '+j.desc+' '+j.loc).toLowerCase();let s=0;f.words.forEach(w=>{if(t.includes(w))s+=f.base.includes(w)?4:2;else if(all.includes(w))s+=1});return[s,j]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]||(b[1]._m||0)-(a[1]._m||0)).map(x=>x[1]);
  }else if(ui.sort==='match'||(f&&f.fit)||cat==='me')arr.sort((a,b)=>(b._m||0)-(a._m||0));
  else if(ui.sort==='deadline'||cat==='week')arr.sort((a,b)=>(a.deadline||'9')<(b.deadline||'9')?-1:1);
  return arr;
}
const findJob=id=>DB.jobs.find(j=>j.id===id)||S.favs[id];
const CATNAME={gov:'Govt',private:'Private',remote:'Remote'};

/* ---------- alerts ---------- */
const GENERIC=new Set('bangladesh limited ltd company officer assistant engineer senior junior general manager sample'.split(' '));
function matchNotices(p){const w=[...new Set(tok(p.org+' '+p.title))].filter(x=>x.length>2&&!GENERIC.has(x));if(!w.length)return[];return DB.notices.filter(n=>{const t=n.title.toLowerCase();return w.filter(x=>t.includes(x)).length>=Math.min(2,w.length)})}
function alerts(){
  const a=[];
  S.apps.forEach(p=>{
    [['examDate','Exam'],['vivaDate','Viva']].forEach(([k,l])=>{if(p[k]){const d=days(p[k]);if(d>=0&&d<=7)a.push({k:p.id+k+p[k],t:l+' '+inDays(d)+': '+p.title})}});
    matchNotices(p).slice(0,2).forEach(n=>a.push({k:p.id+n.id,t:'Possible update for '+(p.org||p.title)+': '+n.title,url:n.url}));
  });
  Object.values(S.favs).forEach(j=>{if(j.deadline){const d=days(j.deadline);if(d>=0&&d<=3&&!S.apps.some(p=>p.jobId===j.id))a.push({k:'f'+j.id+j.deadline,t:'Last date '+inDays(d)+': '+j.title,url:j.url})}});
  return a;
}
async function notify(){
  const a=alerts();const b=$('#bell');b.innerHTML='🔔'+(a.length?'<span class="dot">'+a.length+'</span>':'');
  const fresh=a.filter(x=>!S.seen[x.k]);if(!fresh.length||!S.settings.notify)return;
  try{if(Notification.permission!=='granted')return;const body=fresh.slice(0,3).map(x=>x.t).join('\n');
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg)reg.showNotification('Chakri Finder',{body,icon:'icon-192.png'});else new Notification('Chakri Finder',{body});
    fresh.forEach(x=>S.seen[x.k]=1);save()}catch(e){}
}

/* ---------- views ---------- */
function jobCard(j){
  const fav=!!S.favs[j.id],ap=S.apps.some(p=>p.jobId===j.id),d=j.deadline?days(j.deadline):null;
  return `<div class="card"><div class="row"><span class="tag ${esc(j.cat)}">${CATNAME[j.cat]||'Job'}</span><span class="src">${esc(j.src)}</span>${j._m?`<span class="match">${j._m}% match</span>`:''}</div>
  <h3>${esc(j.title)}</h3><div class="meta">${esc([j.org,j.loc].filter(Boolean).join(' · '))}</div>
  ${j.desc?`<p class="desc">${esc(j.desc)}</p>`:''}
  <div class="meta">${j.deadline?`<b style="color:${d<=3?'var(--bad)':'var(--ok)'}">Last date ${nice(j.deadline)} (${inDays(d)})</b>`:'Last date: see circular'}${j.posted?' · Posted '+nice(j.posted):''}</div>
  <div class="btns"><a class="btn pri" href="${esc(j.url)}" target="_blank" rel="noopener">View &amp; apply</a>
  <button class="btn" data-act="fav" data-id="${esc(j.id)}">${fav?'★ Saved':'☆ Save'}</button>
  <button class="btn" data-act="markApplied" data-id="${esc(j.id)}">${ap?'✓ Applied':'Mark applied'}</button>
  <button class="btn" data-act="tailor" data-id="${esc(j.id)}">Tailor CV</button></div></div>`;
}
function monthCount(k){const m=today().slice(0,7);return S.apps.filter(p=>p[k]&&p[k].slice(0,7)===m).length}
const V={};
V.home=()=>{
  const a=alerts(),wk=DB.jobs.filter(j=>j.deadline&&days(j.deadline)<=7).length,me=DB.jobs.filter(j=>j._m>=20).length;
  const top=DB.jobs.filter(j=>j._m>=20).sort((x,y)=>y._m-x._m).slice(0,4);
  const tile=(n,l,act,hot)=>`<button class="tile ${hot&&n?'hot':''}" ${act}><b>${n}</b><span>${l}</span></button>`;
  return `<div class="card hero"><h3>Assalamu Alaikum${S.profile.name?', '+esc(S.profile.name.split(' ').slice(-2,-1)[0]||S.profile.name):''}</h3><p>${DB.jobs.length} open jobs collected${me?', '+me+' match your resume':''}.</p></div>
  ${DB.demo?'<div class="banner">Showing sample cards. Real jobs appear after the automatic collector runs for the first time.</div>':''}
  ${!S.profile.title?'<div class="banner">Add your resume first so jobs can be matched to you. <button class="btn" data-act="go" data-tab="resume">Open resume</button></div>':''}
  <div class="grid">
  ${tile(DB.jobs.length,'Available jobs','data-act="cat" data-cat="all"')}
  ${tile(me,'Matched for me','data-act="cat" data-cat="me"')}
  ${tile(S.apps.length,'Applied jobs','data-act="go" data-tab="applied"')}
  ${tile(wk,'Last date within 7 days','data-act="cat" data-cat="week"',1)}
  ${tile(monthCount('examDate'),'Exams this month','data-act="go" data-tab="applied"',1)}
  ${tile(monthCount('vivaDate'),'Viva this month','data-act="go" data-tab="applied"',1)}
  ${tile(DB.jobs.filter(j=>j.cat==='gov').length,'Government','data-act="cat" data-cat="gov"')}
  ${tile(DB.jobs.filter(j=>j.cat==='remote').length,'Remote international','data-act="cat" data-cat="remote"')}
  </div>
  <h2>Needs your attention</h2>
  ${a.length?a.map(x=>`<div class="card alert">${esc(x.t)}${x.url?` <a href="${esc(x.url)}" target="_blank" rel="noopener">Open</a>`:''}</div>`).join(''):'<div class="card meta">Nothing urgent. Exam dates, viva dates, last dates of saved jobs and admit/result news for your applications show up here.</div>'}
  ${top.length?'<h2>Best matches for your resume</h2>'+top.map(jobCard).join(''):''}`;
};
V.jobs=()=>{
  const arr=listJobs(),chips=[['all','All'],['me','For me'],['gov','Govt'],['private','Private'],['remote','Remote'],['week','Closing soon'],['saved','Saved']];
  const kw=encodeURIComponent(ui.q.trim()||S.profile.title||'engineer');
  return `<div class="search"><input id="q" placeholder="Try: govt electrical engineer this week" value="${esc(ui.q)}" enterkeyhint="search"><button class="btn pri" data-act="search">Search</button></div>
  <div class="chips">${chips.map(c=>`<button class="${ui.cat===c[0]?'on':''}" data-act="cat" data-cat="${c[0]}">${c[1]}</button>`).join('')}</div>
  <div class="row"><span class="meta">${arr.length} jobs</span><select id="sort" style="width:auto;margin-left:auto;padding:6px 8px"><option value="new">Newest</option><option value="match">Best match</option><option value="deadline">Last date</option></select>
  ${S.settings.aiKey&&ui.q.trim()?'<button class="btn" data-act="aiSearch">Ask AI</button>':''}</div>
  <div id="ai"></div>
  ${arr.slice(0,ui.limit).map(jobCard).join('')||'<div class="empty">No jobs found. Try fewer words or another tab.</div>'}
  ${arr.length>ui.limit?'<button class="btn wide" data-act="more">Show more</button>':''}
  <h2>Search the same thing elsewhere</h2>
  <div class="btns"><a class="btn" target="_blank" rel="noopener" href="https://jobs.bdjobs.com/jobsearch.asp?txtsearch=${kw}">bdjobs</a>

function tailorFor(j){
  const p=S.profile,jw=[...new Set(tok(j.title+' '+(j.tags||[]).join(' ')+' '+j.desc))].slice(0,40);
  const skills=p.skills.split(',').map(s=>s.trim()).filter(Boolean);
  const hit=s=>{const l=s.toLowerCase();return jw.some(w=>l.includes(w)||(SYN[w]||[]).some(x=>l.includes(x)))};
  const first=skills.filter(hit),rest=skills.filter(s=>!hit(s));
  const mine=JSON.stringify(p).toLowerCase(),noise=new Set('govt government application deadline teletalk apply candidates candidate position vacancy vacancies recruitment notice post posts published january february march april june july august september october november december'.split(' ')),missing=jw.filter(w=>w.length>3&&!noise.has(w)&&!mine.includes(w)).slice(0,12);
  const deg=p.education[0]?p.education[0].a:'',exp=p.experience[0];
  const summary=`${p.title||'Professional'}${deg?' with '+deg:''}, applying for ${j.title}${j.org?' at '+j.org:''}. ${first.length?'Relevant strengths: '+first.slice(0,5).join(', ')+'. ':''}${p.summary||''}`.trim();
  const letter=`Dear Hiring Manager,\n\nI am writing to apply for the position of ${j.title}${j.org?' at '+j.org:''}. ${exp?'I currently work as '+exp.a+(exp.b?' at '+exp.b:'')+'. ':''}${deg?'I hold '+deg+(p.education[0].b?' from '+p.education[0].b:'')+'. ':''}\n\n${first.length?'My background in '+first.slice(0,4).join(', ')+' matches the requirements of this role. ':''}I am confident that I can contribute from the first day and I am eager to learn what the position demands.\n\nMy resume is attached. I would welcome the opportunity to discuss my application.\n\nSincerely,\n${p.name}\n${p.phone}\n${p.email}`;
  return{jobId:j.id,jobTitle:j.title,org:j.org||'',desc:j.desc||'',skills:[...first,...rest],missing,summary,letter};
}
async function askAI(prompt){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(S.settings.aiModel)+':generateContent?key='+encodeURIComponent(S.settings.aiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
  const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message||'AI request failed');
  return d.candidates[0].content.parts.map(x=>x.text).join('');
}

  copy(d){const v=d.from?$('#'+d.from).value:d.v;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied'),()=>toast('Copy not available here'))},
  ics(d){const p=S.apps.find(x=>x.id===d.id);const ev=(dt,l)=>dt?`BEGIN:VEVENT\r\nUID:${p.id}${l}@chakri\r\nDTSTAMP:${today().replace(/-/g,'')}T000000Z\r\nDTSTART;VALUE=DATE:${dt.replace(/-/g,'')}\r\nSUMMARY:${l}: ${p.title.replace(/[,;]/g,' ')}\r\nBEGIN:VALARM\r\nTRIGGER:-P1D\r\nACTION:DISPLAY\r\nDESCRIPTION:${l} tomorrow\r\nEND:VALARM\r\nEND:VEVENT\r\n`:'';
    download('exam-dates.ics','BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Chakri Finder//EN\r\n'+ev(p.examDate,'Exam')+ev(p.vivaDate,'Viva')+'END:VCALENDAR\r\n','text/calendar')},
  pickFile(d){const i=document.createElement('input');i.type='file';i.multiple=true;i.accept='image/*,application/pdf,.doc,.docx';i.onchange=async()=>{for(const f of i.files)await Files.put({id:uid(),name:f.name,type:f.type,kind:d.kind,app:d.app||'',added:today(),blob:f});toast('Saved on this phone');drawFiles()};i.click()},
  async openFile(d){const f=(await Files.all()).find(x=>x.id===d.id);if(f)window.open(URL.createObjectURL(f.blob),'_blank')},
  async delFile(d){if(!confirm('Remove this file?'))return;await Files.del(d.id);drawFiles()},
  addRow(d){S.profile[d.list].push({a:'',b:'',c:'',d:''});save();render(true)},
  delRow(d){S.profile[d.list].splice(+d.i,1);save();render(true)},
  print(){window.print()},
  tailor(d){const j=findJob(d.id);if(!j)return;S.tailor=tailorFor(j);save();ui.tab='resume';ui.rtab='tailor';render()},
  saveTailor(){S.tailor.summary=$('#tsum').value;S.tailor.letter=$('#tlet').value;save();ui.rtab='preview';render()},
  untailor(){S.tailor=null;save();render()},
  async aiTailor(){toast('Asking AI…');try{const t=S.tailor;const out=await askAI(`Write (1) a 3-sentence resume profile summary and (2) a short cover letter for this job, using only facts from the resume. Do not invent experience.\nJOB: ${t.jobTitle} at ${t.org}. ${t.desc}\nRESUME:\n${S.profile.name}\n${profileText()}\nReply exactly as: SUMMARY: ... LETTER: ...`);
    const m=out.match(/SUMMARY:\s*([\s\S]*?)LETTER:\s*([\s\S]*)/);if(m){t.summary=m[1].trim();t.letter=m[2].trim();save();render(true);toast('Updated by AI')}else toast('AI reply not understood')}catch(e){toast(e.message)}},
  async aiSearch(){const arr=listJobs().slice(0,40);$('#ai').innerHTML='<div class="banner">Asking AI…</div>';try{const out=await askAI(`A job seeker asks: "${ui.q}".\nTheir resume:\n${profileText()}\nFrom the numbered jobs below choose up to 5 best fits. Reply one per line as: number | short reason.\n`+arr.map((j,i)=>`${i+1}. ${j.title} – ${j.org} – ${j.loc} – ${j.desc.slice(0,120)}`).join('\n'));
    const picks=out.split('\n').map(l=>l.match(/^\D*(\d+)\s*\|\s*(.+)/)).filter(Boolean).map(m=>[arr[+m[1]-1],m[2]]).filter(x=>x[0]);
    $('#ai').innerHTML='<h2>AI picks</h2>'+(picks.map(([j,why])=>`<div class="banner">${esc(why)}</div>`+jobCard(j)).join('')||'<div class="banner">AI found no clear fit.</div>')}catch(e){$('#ai').innerHTML='<div class="banner">'+esc(e.message)+'</div>'}},
  async notifyOn(){if(S.settings.notify){S.settings.notify=false}else{try{const r=await Notification.requestPermission();S.settings.notify=r==='granted';if(r!=='granted')toast('Notifications are blocked in this browser')}catch(e){toast('Notifications are not available here')}}save();render(true)},
  backup(){download('chakri-finder-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json')},
  restore(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const o=JSON.parse(await i.files[0].text());S=merge(Object.assign({},S,o));save();scoreAll();render();toast('Imported')}catch(e){toast('That file could not be read')}};i.click()}
};
document.addEventListener('click',e=>{if(e.target.id==='modal')return closeModal();const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act]){A[b.dataset.act](b.dataset)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q')A.search()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='sort'){ui.sort=t.value;render(true)}
  if(t.id==='aikey'){S.settings.aiKey=t.value.trim();save()}
  if(t.id==='aimodel'){S.settings.aiModel=t.value.trim();save()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.p){S.profile[t.dataset.p]=t.value;save();scoreAll()}
  if(t.dataset.list){S.profile[t.dataset.list][+t.dataset.i][t.dataset.f]=t.value;save();scoreAll()}});

(async()=>{render();await loadData();render();try{if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')}catch(e){}})();
</script>
</body>
</html>

name: Collect jobs
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site.zip', 'scripts/**', '.github/workflows/collect.yml']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if [ -f site.zip ]; then unzip -o site.zip; rm site.zip; fi
          if [ -f scripts/collect.py ]; then python scripts/collect.py; fi
          git config user.name "chakri-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update jobs"
          git push
